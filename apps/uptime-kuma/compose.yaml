services:
  caddy:
    # Digest du manifeste multi-architecture vérifié le 2026-09-29.
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      - uptime-kuma
    ports:
      # 443 sur l'adresse Tailscale est réservé à Tailscale Serve (Portainer).
      - "192.168.1.69:443:443"
      # Relais interne dédié à Netdata. Il est lié au LAN, tandis que Tailscale
      # Serve emploie le même port seulement sur l'adresse Tailscale.
      - "192.168.1.69:8444:8444"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
        mode: 0444
    networks:
      - homelab-proxy
      - kuma
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  uptime-kuma:
    # Digest du manifeste multi-architecture vérifié le 2026-09-29.
    image: louislam/uptime-kuma:2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - kuma
      # Sortie DNS/HTTPS pour les notifications ; aucun port hôte publié.
      # Ce bridge privé au stack n'est pas partagé avec homelab-proxy.
      - kuma-egress
    security_opt:
      - no-new-privileges:true

networks:
  homelab-proxy:
    external: true
  kuma:
    internal: true
    name: uptime-kuma-net
  kuma-egress:
    driver: bridge
    internal: false

volumes:
  caddy_data:
    name: uptime-kuma-caddy-data
  caddy_config:
    name: uptime-kuma-caddy-config
  uptime_kuma_data:
    name: uptime-kuma-data

configs:
  caddyfile:
    content: |
      {
        admin off
      }

      # Nom Docker interne utilisé exclusivement par les sondes Kuma. Les
      # endpoints évitent les redirections vers des noms .home.arpa que le
      # conteneur de supervision ne doit pas résoudre.
      caddy {
        tls internal

        handle /health/kuma {
          rewrite * /setup-database-info
          reverse_proxy uptime-kuma:3001
        }

        handle /health/portainer {
          rewrite * /
          reverse_proxy https://portainer:9443 {
            transport http {
              tls_insecure_skip_verify
            }
          }
        }

        handle /health/netdata {
          rewrite * /api/v3/info
          reverse_proxy netdata:19999
        }

        respond "Caddy internal probe endpoint" 200
      }

      portainer.home.arpa {
        tls internal
        reverse_proxy https://portainer:9443 {
          transport http {
            tls_insecure_skip_verify
          }
        }
      }

      status.home.arpa {
        tls internal
        reverse_proxy uptime-kuma:3001
      }

      netdata.home.arpa {
        tls internal
        reverse_proxy netdata:19999
      }

      # Ce listener sans nom est exclusivement la cible locale du relais
      # Tailscale Netdata. Un port distinct évite que le Host du client
      # tailnet sélectionne par erreur le vhost Kuma sur 443.
      :8444 {
        tls internal
        reverse_proxy netdata:19999
      }

      homelab.tail239aaa.ts.net {
        tls internal
        reverse_proxy uptime-kuma:3001
      }
